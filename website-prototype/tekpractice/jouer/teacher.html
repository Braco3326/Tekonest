      /* Values come from src/design/tokens.ts (injectTokens); fallbacks mirror them for the pre-JS frame. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: var(--tk-bg, #f5f6f8);
        color: var(--tk-ink, #1b2129);
        font-family: var(--tk-font, system-ui, sans-serif);

        line-height: 1.5;

      main { max-width: 960px; margin: 0 auto; padding: var(--tk-space-lg, 20px) var(--tk-space-md, 14px) var(--tk-space-xl, 32px); }

      .drop.over { border-color: var(--tk-accent, #2e5fe6); }
      button, .btn {

      button.quiet { background: var(--tk-surface, #fff); color: var(--tk-ink, #1b2129); border: 1px solid var(--tk-surface-border, #e6e8ee); }
      :focus-visible { outline: 2px solid var(--tk-accent, #2e5fe6); outline-offset: 2px; }
      /* The native input stays focusable and operable (keyboard); only the button look is shared. */
      /* Visually hidden but focusable: Tab reaches it, Enter/Space opens the picker; the label shows the focus ring. */
      #file { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
      .drop:has(#file:focus-visible) #chooseLabel { outline: 2px solid var(--tk-ink, #1b2129); outline-offset: 2px; }

      section.block { margin-top: var(--tk-space-xl, 32px); }
      ol.trail { list-style: none; display: grid; gap: var(--tk-space-md, 14px); }
      .card { background: var(--tk-surface, #fff); border: 1px solid var(--tk-surface-border, #e6e8ee); border-radius: var(--tk-radius-md, 12px); box-shadow: var(--tk-elev-card, none); padding: var(--tk-space-md, 14px); }
      .card header { display: flex; flex-wrap: wrap; gap: 4px var(--tk-space-md, 14px); align-items: baseline; margin-bottom: var(--tk-space-sm, 8px); }
      .meta { color: var(--tk-ink-muted, #5a6372); font-size: var(--tk-text-sm, 12.5px); }
      .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 280px); gap: var(--tk-space-md, 14px); }
      @media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr); } }
      dl.fields dt { font-size: var(--tk-text-sm, 12.5px); font-weight: var(--tk-weight-bold, 650); color: var(--tk-ink-muted, #5a6372); margin-top: var(--tk-space-sm, 8px); }
      dl.fields dd { overflow-wrap: anywhere; }
      dl.fields ul { padding-left: 18px; }
      .pill { font-size: var(--tk-text-xs, 11px); font-weight: var(--tk-weight-bold, 650); border-radius: 99px; padding: 1px 8px; border: 1px solid currentColor; }
      .pill.error, .bad { color: var(--tk-error, #d93a47); }
      .pill.warning { color: var(--tk-warning-ink, #a85a00); }
      .good { color: var(--tk-success-ink, #0b3a21); }
      svg.map { width: 100%; height: auto; max-height: 260px; background: var(--tk-floor, #fcfcfd); border: 1px solid var(--tk-surface-border, #e6e8ee); border-radius: var(--tk-radius-sm, 7px); }
      svg.map .room { fill: none; stroke: var(--tk-ink-muted, #5a6372); stroke-width: 0.04; }
      svg.map .dot { fill: var(--tk-device-body, #465064); }
      svg.map .lbl { fill: var(--tk-ink, #1b2129); font-size: 0.2px; font-family: var(--tk-font, sans-serif); }
      .rubric { list-style: none; display: grid; gap: var(--tk-space-sm, 8px); }
      .rubric label { display: flex; gap: 10px; align-items: flex-start; }
      .rubric input { margin-top: 4px; width: 16px; height: 16px; flex: none; }
      .draft { font-size: var(--tk-text-sm, 12.5px); color: var(--tk-warning-ink, #a85a00); margin-bottom: var(--tk-space-sm, 8px); }
      footer.disclaimer { margin-top: var(--tk-space-xl, 32px); padding-top: var(--tk-space-md, 14px); border-top: 1px solid var(--tk-surface-border, #e6e8ee); color: var(--tk-ink-muted, #5a6372); }
      /* Back to the Tekonest site (key site.back.*); top-right, clear of the page title. */
      #site-link {
        position: absolute; top: var(--tk-space-md, 14px); right: var(--tk-space-md, 14px);
        font-size: var(--tk-text-sm, 12.5px); font-weight: var(--tk-weight-medium, 550);
        color: var(--tk-ink, #1b2129); background: var(--tk-surface, #fff); text-decoration: none; white-space: nowrap;
        border: 1px solid var(--tk-surface-border, #e6e8ee); border-radius: var(--tk-radius-sm, 7px); padding: 6px 11px;
      }
      #site-link:hover { border-color: var(--tk-accent, #2e5fe6); }
      @media (max-width: 700px) { h1 { margin-top: 36px; } }
      @media print { #site-link { display: none; } }
      @media print { .drop, #print { display: none; } body { background: #fff; } .card { break-inside: avoid; box-shadow: none; } }
